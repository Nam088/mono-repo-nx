version: v1
plugins:
    - name: ts-proto
      out: src/lib/generated
      path: ../../node_modules/.bin/protoc-gen-ts_proto
      opt:
          - nestJs=true
          - outputServices=grpc-js
          - outputClientImpl=false
          - esModuleInterop=true
          - useExactTypes=true
          - lowerCaseServiceMethods=true
          - env=node
          - outputIndex=true
